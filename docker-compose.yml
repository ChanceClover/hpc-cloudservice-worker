# Worker relawan di dalam sandbox: non-root, read-only, tanpa capability,
# tanpa akses folder host / docker.sock, dibatasi CPU, RAM, dan jumlah proses.
services:
  worker:
    build: .
    image: hpc-worker
    restart: unless-stopped
    environment:
      COORDINATOR_URL: ${COORDINATOR_URL:?Isi COORDINATOR_URL di .env}
      WORKER_TOKEN: ${WORKER_TOKEN:?Isi WORKER_TOKEN di .env}
      WORKER_NAME: ${WORKER_NAME:-worker}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1
